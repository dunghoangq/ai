[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-transformer"
version = "0.1.0"
description = "A python project to understand Transformer from scratch."
readme = "README.md"
authors = [
    { name = "dunghoangq", email = "dunghoangq@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "ipykernel"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]